[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/locations"
  to = "/areas/"
  status = 301

[[redirects]]
  from = "/locations/"
  to = "/areas/"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/resources/*"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about-us/index.html"
  status = 200

[[redirects]]
  from = "/contact-us"
  to = "/contact-us/index.html"
  status = 200

[[redirects]]
  from = "/contact-us/thank-you"
  to = "/contact-us/thank-you/index.html"
  status = 200

[[redirects]]
  from = "/areas"
  to = "/areas/index.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services/index.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy/index.html"
  status = 200

[[redirects]]
  from = "/faqs"
  to = "/faqs/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/blog/:slug/index.html"
  status = 200

[[redirects]]
  from = "/services/:slug"
  to = "/services/:slug/index.html"
  status = 200

[[redirects]]
  from = "/areas/:slug"
  to = "/areas/:slug/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
