<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base title (react-helmet-async lo sobreescribe por página) -->
    <title>Retaining Walls Builders</title>
    <!-- Brand icons -->
    <meta name="theme-color" content="#163A35" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <!-- Netlify Forms detection -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="formLocation" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="address" />
      <input name="serviceType" />
      <input name="description" />
      <input name="file1" type="file" />
      <input name="file2" type="file" />
      <input name="file3" type="file" />
      <input name="file4" type="file" />
      <input name="file5" type="file" />
      <input name="pageUrl" />
      <input name="gclid" />
      <input name="gbraid" />
      <input name="wbraid" />
      <input name="gad_source" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_term" />
      <input name="utm_content" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
